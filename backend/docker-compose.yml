services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydromind
      POSTGRES_PASSWORD: hydromind
      POSTGRES_DB: hydromind
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydromind"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres_data:
